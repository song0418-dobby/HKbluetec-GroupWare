<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK블루텍 그룹웨어</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --primary-light: #e0f2fe;
            --secondary-color: #475569;
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --border-color: #cbd5e1;
            --border-light: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger-color: #dc2626;
            --success-color: #16a34a;
            --warning-color: #d97706;
            --sidebar-width: 240px;
            --header-height: 60px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); font-size: 14px; line-height: 1.5; height: 100vh; overflow: hidden; }

        /* Auth Screen */
        #authScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.85); display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .auth-card { background: #fff; width: 420px; padding: 32px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .auth-tabs { display: flex; border-bottom: 2px solid var(--border-light); margin-bottom: 20px; }
        .auth-tab { flex: 1; text-align: center; padding: 10px; font-weight: 700; cursor: pointer; color: var(--text-muted); }
        .auth-tab.active { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); }

        /* Header */
        .app-header {
            position: fixed; top: 0; left: 0; right: 0; height: var(--header-height);
            background-color: #0f172a; color: #fff; display: flex; align-items: center;
            justify-content: space-between; padding: 0 20px; z-index: 1000;
        }
        .header-brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; color: #fff; text-decoration: none; }
        .header-nav { display: flex; gap: 4px; height: 100%; }
        .header-nav-item {
            padding: 0 16px; height: 100%; display: flex; align-items: center; gap: 8px;
            color: #94a3b8; text-decoration: none; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent;
        }
        .header-nav-item:hover, .header-nav-item.active { color: #fff; border-bottom-color: #38bdf8; background: rgba(255,255,255,0.05); }

        /* App Container */
        .app-container { display: flex; width: 100%; margin-top: var(--header-height); height: calc(100vh - var(--header-height)); }
        .app-sidebar {
            width: var(--sidebar-width); background-color: var(--bg-surface); border-right: 1px solid var(--border-light);
            display: flex; flex-direction: column; padding: 20px 0; flex-shrink: 0;
        }
        .btn-new-doc {
            margin: 0 16px 20px; padding: 12px; background-color: var(--primary-color); color: #fff; border: none;
            border-radius: 6px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .menu-list { list-style: none; }
        .menu-item a { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; color: var(--secondary-color); text-decoration: none; font-weight: 600; cursor: pointer; }
        .menu-item a:hover, .menu-item.active a { background-color: var(--primary-light); color: var(--primary-color); }

        .app-main { flex: 1; overflow-y: auto; padding: 24px; background-color: var(--bg-body); }
        .page-section { display: none; }
        .page-section.active { display: block; }

        /* Elements */
        .btn { padding: 8px 16px; border-radius: 4px; font-weight: 600; font-size: 13px; cursor: pointer; border: 1px solid var(--border-color); background-color: #fff; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background-color: var(--primary-color); color: #fff; border-color: var(--primary-color); }
        .btn-danger { background-color: var(--danger-color); color: #fff; border-color: var(--danger-color); }
        .btn-success { background-color: var(--success-color); color: #fff; border-color: var(--success-color); }

        .card { background: #fff; border-radius: 8px; padding: 20px; border: 1px solid var(--border-light); margin-bottom: 20px; }
        .data-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--border-light); }
        .data-table th, .data-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border-light); }
        .data-table th { background: #f8fafc; font-weight: 700; font-size: 12px; }

        .badge-status { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
        .badge-pending { background: #fef3c7; color: var(--warning-color); }
        .badge-approved { background: #dcfce7; color: var(--success-color); }
        .badge-admin { background: #e0f2fe; color: #0284c7; border: 1px solid #0284c7; }

        .form-control { width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 13px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 12px; }

        /* Document Form Style */
        .document-wrapper { background: #fff; max-width: 900px; margin: 0 auto; padding: 35px 40px; border: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .doc-header-selector { background: #f1f5f9; padding: 12px 20px; border-radius: 6px; display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .doc-title-main { text-align: center; font-size: 24px; font-weight: 800; margin-bottom: 25px; color: #0f172a; text-decoration: underline; text-underline-offset: 6px; }
        .doc-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 13px; }
        .doc-table th, .doc-table td { border: 1px solid #94a3b8; padding: 8px 10px; text-align: center; }
        .doc-table th { background: #f1f5f9; font-weight: 700; color: #334155; }

        .modal-overlay { position: fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:9000; }
        .modal-body { background:#fff; width:450px; border-radius:8px; padding:24px; }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="authScreen">
        <div class="auth-card">
            <h2 style="text-align:center; margin-bottom:5px;"><i class="fa-solid fa-gem" style="color:#0284c7;"></i> HK블루텍</h2>
            <p style="text-align:center; color:#64748b; font-size:12px; margin-bottom:20px;">그룹웨어 인증 센터</p>
            
            <div class="auth-tabs">
                <div id="tabLogin" class="auth-tab active" onclick="switchTab('login')">로그인</div>
                <div id="tabReg" class="auth-tab" onclick="switchTab('register')">회원가입</div>
            </div>

            <!-- LOGIN -->
            <div id="loginArea">
                <div class="form-group">
                    <label>아이디</label>
                    <input type="text" id="loginId" class="form-control" placeholder="아이디 입력">
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="loginPw" class="form-control" placeholder="비밀번호 입력">
                </div>
                <button type="button" class="btn btn-primary" style="width:100%; padding:10px; justify-content:center; margin-top:10px;" onclick="doLogin()">로그인</button>
            </div>

            <!-- REGISTER -->
            <div id="registerArea" style="display:none;">
                <div class="form-group">
                    <label>아이디</label>
                    <input type="text" id="regId" class="form-control" placeholder="아이디 입력">
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="regPw" class="form-control" placeholder="비밀번호 입력">
                </div>
                <div class="form-group">
                    <label>성명</label>
                    <input type="text" id="regName" class="form-control" placeholder="이름 입력">
                </div>
                <div class="form-group">
                    <label>직급</label>
                    <input type="text" id="regPos" class="form-control" placeholder="예: 대리, 과장, 부장">
                </div>
                <div class="form-group">
                    <label>부서</label>
                    <input type="text" id="regDept" class="form-control" placeholder="예: 서비스관리팀, 영업팀">
                </div>
                <button type="button" class="btn btn-success" style="width:100%; padding:10px; justify-content:center; margin-top:10px;" onclick="doRegister()">회원가입 완료</button>
            </div>
        </div>
    </div>

    <!-- APP HEADER -->
    <header class="app-header">
        <a href="#" class="header-brand" onclick="showSection('sec-home');">
            <i class="fa-solid fa-gem" style="color:#38bdf8;"></i> HK블루텍 GROUPWARE
        </a>
        <nav class="header-nav">
            <div class="header-nav-item active" onclick="setActiveNav(this); showSection('sec-home');">홈</div>
            <div class="header-nav-item" onclick="setActiveNav(this); showSection('sec-approval'); renderDocs();">전자결재</div>
            <div class="header-nav-item" onclick="setActiveNav(this); showSection('sec-schedule');">일정관리</div>
            <div class="header-nav-item" onclick="setActiveNav(this); showSection('sec-members'); renderMembers();">임직원 관리</div>
        </nav>
        <div>
            <span id="userInfoText" style="font-weight:700; color:#fff; margin-right:15px;">-</span>
            <button class="btn" style="padding:4px 8px;" onclick="doLogout()">로그아웃</button>
        </div>
    </header>

    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="app-sidebar">
            <button class="btn-new-doc" onclick="openNewForm()"><i class="fa-solid fa-pen-to-square"></i> 새 결재 작성</button>
            <ul class="menu-list">
                <li class="menu-item active">
                    <a onclick="showSection('sec-approval'); renderDocs();">
                        <span><i class="fa-solid fa-inbox"></i> 전자결재함</span>
                        <span class="badge-status badge-pending" id="docCountBadge">0</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a onclick="showSection('sec-schedule');">
                        <span><i class="fa-solid fa-calendar-days"></i> 전사 일정</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a onclick="showSection('sec-members'); renderMembers();">
                        <span><i class="fa-solid fa-users-gear"></i> 임직원 조직도</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- MAIN -->
        <main class="app-main">

            <!-- HOME DASHBOARD -->
            <section id="sec-home" class="page-section active">
                <h2 style="margin-bottom:20px;">대시보드</h2>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                    <div class="card">
                        <h3><i class="fa-solid fa-file-invoice"></i> 전자결재 건수</h3>
                        <p style="font-size:28px; font-weight:800; color:var(--warning-color); margin-top:10px;" id="dashDocCount">0 건</p>
                    </div>
                    <div class="card">
                        <h3><i class="fa-solid fa-users"></i> 등록 임직원 수</h3>
                        <p style="font-size:28px; font-weight:800; color:var(--success-color); margin-top:10px;" id="dashMemCount">0 명</p>
                    </div>
                </div>
            </section>

            <!-- APPROVAL LIST -->
            <section id="sec-approval" class="page-section">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2>📑 전자결재 문서 목록</h2>
                    <button class="btn btn-primary" onclick="openNewForm()"><i class="fa-solid fa-plus"></i> 결재 기안 작성</button>
                </div>
                <div class="card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>문서번호</th>
                                <th>양식명</th>
                                <th>기안일자</th>
                                <th>제목</th>
                                <th>기안자</th>
                                <th>상태</th>
                                <th>상세보기</th>
                            </tr>
                        </thead>
                        <tbody id="docTbody"></tbody>
                    </table>
                </div>
            </section>

            <!-- SCHEDULE SECTION -->
            <section id="sec-schedule" class="page-section">
                <h2 style="margin-bottom:20px;">📅 전사 일정 관리</h2>
                <div class="card">
                    <p style="color:var(--text-muted);">전사 공유 일정이 등록되는 공간입니다.</p>
                </div>
            </section>

            <!-- FORM & DETAIL SECTION -->
            <section id="sec-form" class="page-section">
                <div style="margin-bottom:20px; display:flex; justify-content:space-between;">
                    <button class="btn" onclick="showSection('sec-approval'); renderDocs();"><i class="fa-solid fa-arrow-left"></i> 목록으로</button>
                    <div id="formActionArea"></div>
                </div>

                <div class="document-wrapper">
                    <div class="doc-header-selector">
                        <label>결재 양식 선택:</label>
                        <select id="formTypeSelect" class="form-control" style="width:200px;" onchange="changeFormTitle(this.value)">
                            <option value="구매 품의서">구매 품의서</option>
                            <option value="지출 결의서">지출 결의서</option>
                            <option value="휴가 신청서">휴가 신청서</option>
                            <option value="업무 기안서">업무 기안서</option>
                        </select>
                    </div>

                    <h1 class="doc-title-main" id="formHeaderTitle">HK블루텍 구매 품의서</h1>
                    
                    <table class="doc-table">
                        <tr>
                            <th style="width:20%;">문서번호</th><td id="docNumText">-</td>
                            <th style="width:20%;">기안부서</th><td id="docDeptText">-</td>
                        </tr>
                        <tr>
                            <th>기안자</th><td id="docAuthorText">-</td>
                            <th>기안일자</th><td id="docDateText">-</td>
                        </tr>
                    </table>

                    <div class="form-group" style="margin-top:20px;">
                        <label>문서 제목</label>
                        <input type="text" id="docTitleInput" class="form-control" placeholder="문서 제목을 입력하세요.">
                    </div>

                    <div class="form-group">
                        <label>상세 내용</label>
                        <textarea id="docContentInput" class="form-control" rows="6" placeholder="상세 결재 내용을 작성하세요."></textarea>
                    </div>
                </div>
            </section>

            <!-- MEMBERS MANAGEMENT -->
            <section id="sec-members" class="page-section">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2>👥 임직원 및 조직도 관리</h2>
                    <button class="btn btn-primary" onclick="openAddMemberModal()"><i class="fa-solid fa-user-plus"></i> 사원 직접 추가</button>
                </div>
                <div class="card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>아이디</th>
                                <th>성명</th>
                                <th>직급</th>
                                <th>부서</th>
                                <th>권한</th>
                            </tr>
                        </thead>
                        <tbody id="memberTbody"></tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <!-- MEMBER ADD MODAL -->
    <div id="memberModal" class="modal-overlay">
        <div class="modal-body">
            <h3 style="margin-bottom:15px;">신규 사원 등록</h3>
            <div class="form-group"><label>아이디</label><input type="text" id="mId" class="form-control"></div>
            <div class="form-group"><label>비밀번호</label><input type="password" id="mPw" class="form-control" value="1234"></div>
            <div class="form-group"><label>성명</label><input type="text" id="mName" class="form-control"></div>
            <div class="form-group"><label>직급</label><input type="text" id="mPos" class="form-control"></div>
            <div class="form-group"><label>부서</label><input type="text" id="mDept" class="form-control"></div>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;">
                <button class="btn" onclick="closeModal('memberModal')">취소</button>
                <button class="btn btn-primary" onclick="saveNewMember()">저장하기</button>
            </div>
        </div>
    </div>

    <script>
        // FIREBASE SETUP
        const firebaseConfig = {
            apiKey: "AIzaSyAgEmCFvCI7Ou8jPkfngObTLJGaYPQbz18",
            authDomain: "hkbluetec.firebaseapp.com",
            databaseURL: "https://hkbluetec-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hkbluetec",
            storageBucket: "hkbluetec.firebasestorage.app",
            messagingSenderId: "997191589965",
            appId: "1:997191589965:web:e29d58d70c8e8d3d24fc04"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let usersData = {
            'song0418_hk': { id: 'song0418_hk', pw: '1234', name: '송관리자', pos: '최고관리자', dept: '서비스관리팀', isAdmin: true }
        };
        let docsData = {};
        let currentUser = null;

        // DB REALTIME SYNC (CHALLENGE FIXED: child_added & value sync)
        window.onload = function() {
            const session = sessionStorage.getItem('HK_USER');
            if (session) {
                try {
                    currentUser = JSON.parse(session);
                    document.getElementById('userInfoText').innerText = `${currentUser.name} (${currentUser.pos} / ${currentUser.dept})`;
                    document.getElementById('authScreen').style.display = 'none';
                } catch(e) {}
            }

            // Realtime Sync Users
            db.ref('users').on('value', (snap) => {
                const val = snap.val();
                if(val) usersData = { ...usersData, ...val };
                renderMembers();
                updateDashboard();
            }, (err) => console.error("Firebase Users Read Failed:", err));

            // Realtime Sync Docs
            db.ref('docs').on('value', (snap) => {
                const val = snap.val();
                if(val) docsData = val;
                renderDocs();
                updateDashboard();
            }, (err) => console.error("Firebase Docs Read Failed:", err));
        };

        function switchTab(type) {
            if(type === 'login') {
                document.getElementById('tabLogin').className = 'auth-tab active';
                document.getElementById('tabReg').className = 'auth-tab';
                document.getElementById('loginArea').style.display = 'block';
                document.getElementById('registerArea').style.display = 'none';
            } else {
                document.getElementById('tabLogin').className = 'auth-tab';
                document.getElementById('tabReg').className = 'auth-tab active';
                document.getElementById('loginArea').style.display = 'none';
                document.getElementById('registerArea').style.display = 'block';
            }
        }

        // LOGIN WITH SAFE CHECK
        function doLogin() {
            const id = document.getElementById('loginId').value.trim().toLowerCase();
            const pw = document.getElementById('loginPw').value.trim();

            if(!id || !pw) return alert('아이디와 비밀번호를 모두 입력해 주세요.');

            const target = usersData[id];
            if(!target) return alert('존재하지 않는 아이디입니다.');
            if(String(target.pw) !== String(pw)) return alert('비밀번호가 일치하지 않습니다.');

            currentUser = target;
            sessionStorage.setItem('HK_USER', JSON.stringify(currentUser));
            document.getElementById('userInfoText').innerText = `${currentUser.name} (${currentUser.pos} / ${currentUser.dept})`;
            document.getElementById('authScreen').style.display = 'none';
            showSection('sec-approval');
            renderDocs();
        }

        // REGISTER WITH FIREBASE CATCH
        function doRegister() {
            const id = document.getElementById('regId').value.trim().toLowerCase();
            const pw = document.getElementById('regPw').value.trim();
            const name = document.getElementById('regName').value.trim();
            const pos = document.getElementById('regPos').value.trim();
            const dept = document.getElementById('regDept').value.trim();

            if(!id || !pw || !name || !pos || !dept) return alert('모든 회원가입 항목을 입력해 주세요.');
            if(usersData[id]) return alert('이미 등록된 아이디입니다.');

            const newUser = { id, pw, name, pos, dept, isAdmin: (id === 'song0418_hk') };

            usersData[id] = newUser;
            db.ref(`users/${id}`).set(newUser)
                .then(() => {
                    alert(`[${name}] 님의 회원가입이 완료되었습니다.`);
                    document.getElementById('regId').value = '';
                    document.getElementById('regPw').value = '';
                    document.getElementById('regName').value = '';
                    document.getElementById('regPos').value = '';
                    document.getElementById('regDept').value = '';
                    switchTab('login');
                    document.getElementById('loginId').value = id;
                })
                .catch((err) => {
                    alert('저장 실패: Firebase 권한 규칙을 확인해 주세요. (' + err.message + ')');
                });
        }

        function doLogout() {
            sessionStorage.removeItem('HK_USER');
            location.reload();
        }

        function showSection(secId) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.getElementById(secId).classList.add('active');
        }

        function setActiveNav(el) {
            document.querySelectorAll('.header-nav-item').forEach(i => i.classList.remove('active'));
            if(el) el.classList.add('active');
        }

        function changeFormTitle(val) {
            document.getElementById('formHeaderTitle').innerText = `HK블루텍 ${val}`;
        }

        // RENDER DOCS
        function renderDocs() {
            const tbody = document.getElementById('docTbody');
            if(!tbody) return;
            tbody.innerHTML = '';

            const list = Object.values(docsData);
            if(list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:30px; color:#64748b;">상신된 전자결재 문서가 없습니다.</td></tr>`;
                return;
            }

            list.reverse().forEach(d => {
                const tr = document.createElement('tr');
                let badge = d.status === 'approved' ? '<span class="badge-status badge-approved">승인완료</span>' : '<span class="badge-status badge-pending">결재대기</span>';

                tr.innerHTML = `
                    <td><strong>${d.id}</strong></td>
                    <td>${d.formType}</td>
                    <td>${d.date}</td>
                    <td><strong>${d.title}</strong></td>
                    <td>${d.author}</td>
                    <td>${badge}</td>
                    <td><button class="btn btn-primary" style="padding:4px 8px; font-size:11px;" onclick="viewDocDetail('${d.id}')">상세보기</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // NEW FORM (UNIQUE TIMESTAMP ID GENERATION TO PREVENT CONFLICT)
        function openNewForm() {
            showSection('sec-form');
            const now = new Date();
            const dateStr = now.toISOString().substring(0, 10).replace(/-/g, '');
            const timeStr = String(now.getTime()).slice(-4);
            const newId = `HK-${dateStr}-${timeStr}`;
            const today = now.toISOString().substring(0, 10);

            document.getElementById('docNumText').innerText = newId;
            document.getElementById('docDeptText').innerText = currentUser ? currentUser.dept : '서비스관리팀';
            document.getElementById('docAuthorText').innerText = currentUser ? `${currentUser.name} ${currentUser.pos}` : '기안자';
            document.getElementById('docDateText').innerText = today;
            document.getElementById('docTitleInput').value = '';
            document.getElementById('docContentInput').value = '';

            document.getElementById('formActionArea').innerHTML = `<button class="btn btn-primary" onclick="submitDoc('${newId}')"><i class="fa-solid fa-paper-plane"></i> 결재 상신하기</button>`;
        }

        function submitDoc(docId) {
            const title = document.getElementById('docTitleInput').value.trim();
            const content = document.getElementById('docContentInput').value.trim();

            if(!title) return alert('문서 제목을 입력하세요.');

            const doc = {
                id: docId,
                formType: document.getElementById('formTypeSelect').value,
                title: title,
                content: content,
                author: currentUser ? `${currentUser.name} ${currentUser.pos}` : '기안자',
                dept: currentUser ? currentUser.dept : '서비스관리팀',
                date: document.getElementById('docDateText').innerText,
                status: 'pending'
            };

            docsData[docId] = doc;
            db.ref(`docs/${docId}`).set(doc)
                .then(() => {
                    alert('전자결재 문서가 성공적으로 상신되었습니다.');
                    showSection('sec-approval');
                    renderDocs();
                })
                .catch(err => alert('문서 상신 실패: ' + err.message));
        }

        function viewDocDetail(docId) {
            showSection('sec-form');
            const d = docsData[docId];
            if(!d) return;

            document.getElementById('docNumText').innerText = d.id;
            document.getElementById('docDeptText').innerText = d.dept;
            document.getElementById('docAuthorText').innerText = d.author;
            document.getElementById('docDateText').innerText = d.date;
            document.getElementById('docTitleInput').value = d.title;
            document.getElementById('docContentInput').value = d.content || '';

            if(d.status === 'approved') {
                document.getElementById('formActionArea').innerHTML = `<span class="badge-status badge-approved" style="font-size:13px; padding:6px 12px;">최종 승인 완료 문서</span>`;
            } else {
                document.getElementById('formActionArea').innerHTML = `<button class="btn btn-success" onclick="approveDoc('${d.id}')"><i class="fa-solid fa-check"></i> 결재 승인하기</button>`;
            }
        }

        function approveDoc(docId) {
            if(docsData[docId]) {
                docsData[docId].status = 'approved';
                db.ref(`docs/${docId}/status`).set('approved')
                    .then(() => {
                        alert('결재 문서 승인이 완료되었습니다.');
                        showSection('sec-approval');
                        renderDocs();
                    })
                    .catch(err => alert('승인 실패: ' + err.message));
            }
        }

        function renderMembers() {
            const tbody = document.getElementById('memberTbody');
            if(!tbody) return;
            tbody.innerHTML = '';

            Object.values(usersData).forEach(u => {
                const tr = document.createElement('tr');
                const badge = u.isAdmin ? '<span class="badge-status badge-admin">관리자</span>' : '<span class="badge-status" style="background:#f1f5f9;">일반사원</span>';
                tr.innerHTML = `
                    <td><strong>${u.id}</strong></td>
                    <td>${u.name}</td>
                    <td>${u.pos}</td>
                    <td>${u.dept}</td>
                    <td>${badge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openAddMemberModal() {
            document.getElementById('memberModal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function saveNewMember() {
            const id = document.getElementById('mId').value.trim().toLowerCase();
            const pw = document.getElementById('mPw').value.trim();
            const name = document.getElementById('mName').value.trim();
            const pos = document.getElementById('mPos').value.trim();
            const dept = document.getElementById('mDept').value.trim();

            if(!id || !name) return alert('아이디와 이름은 필수입니다.');

            const u = { id, pw, name, pos, dept, isAdmin: false };
            usersData[id] = u;
            db.ref(`users/${id}`).set(u)
                .then(() => {
                    alert('새 사원이 등록되었습니다.');
                    closeModal('memberModal');
                    renderMembers();
                })
                .catch(err => alert('등록 실패: ' + err.message));
        }

        function updateDashboard() {
            const docLen = Object.keys(docsData).length;
            const memLen = Object.keys(usersData).length;

            if(document.getElementById('docCountBadge')) document.getElementById('docCountBadge').innerText = docLen;
            if(document.getElementById('dashDocCount')) document.getElementById('dashDocCount').innerText = `${docLen} 건`;
            if(document.getElementById('dashMemCount')) document.getElementById('dashMemCount').innerText = `${memLen} 명`;
        }
    </script>
</body>
</html>
